<!doctype html>
<html lang="en" data-resolution="square">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="./gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: #102431; }
      #root { position: relative; width: 1080px; height: 1080px; overflow: hidden; }
      #photo { position: absolute; inset: 0; width: 1080px; height: 1080px; object-fit: cover; object-position: 73% center; transform-origin: 72% 40%; }
      #sweep {
        position: absolute; top: -20%; left: -60%; width: 60%; height: 140%;
        background: linear-gradient(100deg, rgba(255,244,214,0) 0%, rgba(255,244,214,.22) 50%, rgba(255,244,214,0) 100%);
        transform: skewX(-12deg); mix-blend-mode: screen;
      }
      .mote { position: absolute; border-radius: 50%; background: rgba(255,244,214,.9); filter: blur(1px); opacity: 0; }
      #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 60% 40%, rgba(16,36,49,0) 55%, rgba(16,36,49,.28) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1080">
      <img id="photo" class="clip" data-start="0" data-duration="8" data-track-index="0" src="../../assets/educator-hero.jpg" alt="" />
      <div id="sweep" class="clip" data-start="0" data-duration="8" data-track-index="1"></div>
      <div id="vignette" class="clip" data-start="0" data-duration="8" data-track-index="2"></div>
      <div class="mote clip" id="m1" data-start="0" data-duration="8" data-track-index="3" style="left:180px;top:760px;width:8px;height:8px"></div>
      <div class="mote clip" id="m2" data-start="0" data-duration="8" data-track-index="3" style="left:340px;top:640px;width:5px;height:5px"></div>
      <div class="mote clip" id="m3" data-start="0" data-duration="8" data-track-index="3" style="left:520px;top:820px;width:10px;height:10px"></div>
      <div class="mote clip" id="m4" data-start="0" data-duration="8" data-track-index="3" style="left:690px;top:700px;width:6px;height:6px"></div>
      <div class="mote clip" id="m5" data-start="0" data-duration="8" data-track-index="3" style="left:850px;top:880px;width:7px;height:7px"></div>
      <div class="mote clip" id="m6" data-start="0" data-duration="8" data-track-index="3" style="left:90px;top:520px;width:5px;height:5px"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // slow push-in on the photo
      tl.fromTo("#photo", { scale: 1 }, { scale: 1.09, duration: 8, ease: "sine.inOut" }, 0);
      // one soft window-light sweep across the frame
      tl.fromTo("#sweep", { x: 0 }, { x: 2100, duration: 4.6, ease: "power2.inOut" }, 0.8);
      // drifting dust motes in the light
      const drift = [
        ["#m1", 0.2, -150, -60], ["#m2", 0.7, -110, 40], ["#m3", 1.0, -190, -90],
        ["#m4", 1.5, -130, -30], ["#m5", 0.4, -170, -110], ["#m6", 2.0, -90, -70],
      ];
      drift.forEach(([id, t, y, x]) => {
        tl.fromTo(id, { opacity: 0, y: 0, x: 0 }, { opacity: 0.85, duration: 1.4, ease: "sine.out" }, t);
        tl.to(id, { y: y * 2.2, x: x * 2.2, duration: 6.2, ease: "none" }, t);
        tl.to(id, { opacity: 0, duration: 1.6, ease: "sine.in" }, t + 4.6);
      });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
